<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MC Check settings</title>
  <style>
    body { font: 14px/1.5 system-ui, Arial, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 20px; }
    label { display: block; font-weight: 600; margin-top: 20px; }
    small { display: block; color: #5f6368; font-weight: 400; }
    textarea, input { font: inherit; padding: 6px 8px; margin-top: 6px; border: 1px solid #dadce0; border-radius: 6px; }
    textarea { width: 100%; height: 80px; box-sizing: border-box; }
    input[type=number] { width: 90px; }
    .row { margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid #dadce0; background: #fff; cursor: pointer; }
    button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    #msg { color: #137333; }
  </style>
</head>
<body>
  <h1>MC Check settings</h1>

  <label for="ignore">MC#s to ignore
    <small>Your own company's MC#, or any other MC# that should never be checked. One per line or comma-separated.</small>
  </label>
  <textarea id="ignore" placeholder="123456"></textarea>

  <label for="cacheHours">Remember results for (hours)
    <small>A carrier is re-checked on Highway after this long.</small>
  </label>
  <input id="cacheHours" type="number" min="0.1" step="0.5" />

  <label for="workers">Highway tabs working at once (1–6)
    <small>More is faster during bursts; 3 is a safe default.</small>
  </label>
  <input id="workers" type="number" min="1" max="6" step="1" />

  <div class="row">
    <button class="primary" id="save">Save</button>
    <button id="clear">Clear saved results</button>
    <button id="fast">Re-enable fast Highway navigation</button>
    <span id="msg"></span>
  </div>

  <h2 style="font-size:17px;margin-top:40px">Diagnostics</h2>
  <p style="color:#5f6368;margin:4px 0 0">
    If tags are wrong or missing: keep a DAT tab open after running a truck search, then click
    <b>Run diagnostics</b>. It does a fresh Highway lookup of the MC# below and collects what the
    extension sees on DAT. Click <b>Copy report</b> and send it to whoever maintains the extension.
  </p>
  <div class="row">
    <input id="diagMc" value="689501" style="width:120px" aria-label="Test MC#" />
    <button class="primary" id="diagRun">Run diagnostics</button>
    <button id="diagCopy" disabled>Copy report</button>
    <span id="diagMsg"></span>
  </div>
  <pre id="diagOut" style="white-space:pre-wrap;word-break:break-all;background:#f1f3f4;border-radius:6px;padding:10px;font-size:11px;max-height:420px;overflow:auto;display:none"></pre>

  <script src="options.js"></script>
</body>
</html>
